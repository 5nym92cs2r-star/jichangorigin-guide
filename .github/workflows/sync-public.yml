name: 同步公开文章目录

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-public.yml'
      - '.github/scripts/sync-public.py'

permissions:
  contents: write

concurrency:
  group: public-catalog
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == '5nym92cs2r-star/jichangorigin-guide'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 读取公开展示仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: 检查公开文件范围
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          allowed = {'.gitignore', 'README.md', 'ARTICLES.md', '.github/workflows/sync-public.yml', '.github/scripts/sync-public.py'}
          tracked = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().rstrip('\0').split('\0'))
          if tracked - allowed or any(Path(p).is_symlink() for p in tracked):
              raise SystemExit('Unexpected files in public repository; refusing synchronization.')
          PY
      - name: 只读取网站公开 RSS
        run: python3 .github/scripts/sync-public.py
      - name: 自动上传文章目录变化
        run: |
          git add -- ARTICLES.md
          if git diff --cached --quiet; then
            echo '公开文章目录没有变化，无需提交。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '更新机场ORG公开文章目录'
          git push origin HEAD:main
